
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#173b75">
    <title>Offline - School Manager</title>

    <style>
        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #202938;
        }

        main {
            max-width: 520px;
            margin: 8vh auto;
            padding: 28px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 18px #00000012;
            text-align: center;
        }

        button {
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            background: #173b75;
            color: white;
            cursor: pointer;
        }

        .status {
            margin: 18px 0;
            padding: 12px;
            background: #eef2f7;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <main>
        <h1>School Manager</h1>
        <h2>You are offline</h2>

        <p>Your device cannot currently reach the school server.</p>

        <div class="status" id="connection-status">
            Checking connection...
        </div>

        <p>
            Offline access to previously saved school records
            will be added in a later step.
        </p>

        <button onclick="window.location.reload()">
            Try Again
        </button>
    </main>

    <script>
        function updateStatus() {
            const status = document.getElementById("connection-status");

            status.textContent = navigator.onLine
                ? "Your device has a network connection, but the school server may be unavailable."
                : "No network connection detected.";
        }

        window.addEventListener("online", updateStatus);
        window.addEventListener("offline", updateStatus);

        updateStatus();
    </script>
</body>
</html>
